<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Остання зона</title>
<style>
:root{--ov:rgba(18,10,46,.88);--ink:#f1edff;--hot:#ff4fa3;--zap:#39e0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ov:rgba(30,18,70,.9)}}
html,body{margin:0;height:100%;background:#0f0a24;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));display:grid;gap:8px;pointer-events:none;font-weight:700}
.bar{width:220px;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden}
#hp{height:100%;width:100%;background:#4be37a;transition:width .1s}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:var(--ov);text-align:center;padding:20px}
#ov div{max-width:460px}
h1{font-family:'Arial Black',Impact,sans-serif;font-size:clamp(2.2rem,8vw,3.6rem);margin:0 0 12px;transform:skewX(-7deg)}
p{line-height:1.55;margin:8px 0}
button{margin-top:18px;background:var(--hot);color:#fff;border:0;border-radius:6px;padding:14px 30px;font:700 1.1rem 'Arial Black',sans-serif;cursor:pointer;transform:skewX(-7deg)}
button:focus-visible{outline:3px solid var(--zap);outline-offset:3px}
kbd{background:rgba(255,255,255,.15);border-radius:4px;padding:1px 7px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="al">Живих: 12</div><div class="bar"><div id="hp"></div></div><div id="wd">Дерево: 30</div><div id="st"></div></div>
<div id="ov"><div>
<h1 id="tt">Остання зона</h1>
<p id="tx">Ви і ще 11 гравців на острові. Шторм стискає карту — виживе лише один.</p>
<p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> рух · миша — приціл і вогонь · <kbd>E</kbd> або <kbd>Пробіл</kbd> — поставити стіну (10 дерева)</p>
<p>Збирайте коричневі ящики (дерево) і зелені хрести (здоров’я). Потрібна клавіатура та миша.</p>
<button id="go">Грати</button>
</div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function rs(){W=C.width=innerWidth;H=C.height=innerHeight}addEventListener('resize',rs);rs();
const M=2400,R0=1900,rnd=(a,b)=>a+Math.random()*(b-a),$=id=>document.getElementById(id);
let A=[],P,B=[],Wl=[],trees=[],pk=[],t=0,cx=1200,cy=1200,R=R0,run=false,keys={},mouse={x:0,y:0,d:false},last=0,camx=0,camy=0,pend=false;
function mk(i){return{i,x:rnd(200,M-200),y:rnd(200,M-200),hp:100,wood:i?rnd(0,20):30,cd:0,a:0,tx:0,ty:0,tt:0,bc:0,sd:Math.random()<.5?1:-1}}
function start(){
  A=[];for(let i=0;i<12;i++)A.push(mk(i));P=A[0];B=[];Wl=[];t=0;R=R0;
  cx=rnd(900,1500);cy=rnd(900,1500);
  trees=Array.from({length:70},()=>({x:rnd(60,M-60),y:rnd(60,M-60),r:rnd(26,44)}));
  pk=Array.from({length:90},()=>({x:rnd(60,M-60),y:rnd(60,M-60),k:Math.random()<.7?'w':'h'}));
  run=true;$('ov').style.display='none';last=performance.now();requestAnimationFrame(loop);
}
$('go').onclick=start;
addEventListener('keydown',e=>{keys[e.code]=true;if((e.code==='KeyE'||e.code==='Space')&&!e.repeat){pend=true;e.preventDefault()}});
addEventListener('keyup',e=>keys[e.code]=false);
C.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
C.addEventListener('mousedown',()=>mouse.d=true);addEventListener('mouseup',()=>mouse.d=false);
C.addEventListener('contextmenu',e=>e.preventDefault());

function shoot(a,ang,dmg){B.push({x:a.x+Math.cos(ang)*20,y:a.y+Math.sin(ang)*20,vx:Math.cos(ang)*900,vy:Math.sin(ang)*900,l:.9,o:a,d:dmg})}
function build(a){
  if(a.wood<10)return;
  const px=a.x+Math.cos(a.a)*70,py=a.y+Math.sin(a.a)*70,v=Math.abs(Math.cos(a.a))>Math.abs(Math.sin(a.a));
  const w=v?16:90,h=v?90:16;a.wood-=10;Wl.push({x:px-w/2,y:py-h/2,w,h,hp:150});
}
function move(a,vx,vy,dt){
  a.x=Math.min(M-20,Math.max(20,a.x+vx*dt));a.y=Math.min(M-20,Math.max(20,a.y+vy*dt));
  for(const w of Wl){
    const qx=Math.max(w.x,Math.min(a.x,w.x+w.w)),qy=Math.max(w.y,Math.min(a.y,w.y+w.h));
    let dx=a.x-qx,dy=a.y-qy,d=Math.hypot(dx,dy);
    if(d<15){if(d===0){dy=-1;d=1}a.x+=dx/d*(15-d);a.y+=dy/d*(15-d)}
  }
}
function ai(a,dt){
  let tg=null,bd=1e9;
  for(const o of A)if(o!==a){const d=Math.hypot(o.x-a.x,o.y-a.y);if(d<bd){bd=d;tg=o}}
  let mx=0,my=0;const dc=Math.hypot(cx-a.x,cy-a.y);
  if(tg&&bd<500)a.a=Math.atan2(tg.y-a.y,tg.x-a.x);
  if(dc>R-150){const q=Math.atan2(cy-a.y,cx-a.x);mx=Math.cos(q);my=Math.sin(q)}
  else if(tg&&bd<500){
    const q=a.a;
    if(bd>260){mx=Math.cos(q);my=Math.sin(q)}else{mx=-Math.sin(q)*a.sd;my=Math.cos(q)*a.sd}
    if(Math.random()<dt*.5)a.sd*=-1;
  }else{
    a.tt-=dt;
    if(a.tt<=0||Math.hypot(a.tx-a.x,a.ty-a.y)<30){
      const p=pk[Math.floor(Math.random()*pk.length)];
      if(p&&Math.random()<.6){a.tx=p.x;a.ty=p.y}else{a.tx=cx+rnd(-R*.6,R*.6);a.ty=cy+rnd(-R*.6,R*.6)}
      a.tt=rnd(3,7);
    }
    const q=Math.atan2(a.ty-a.y,a.tx-a.x);mx=Math.cos(q);my=Math.sin(q);a.a=q;
  }
  move(a,mx*150,my*150,dt);
  if(tg&&bd<500&&a.cd<=0){shoot(a,a.a+rnd(-.13,.13),10);a.cd=.55}
  a.bc-=dt;
  if(tg&&bd<350&&a.hp<60&&a.bc<=0&&a.wood>=10){build(a);a.bc=4}
}
function update(dt){
  t+=dt;R=Math.max(40,R0-t*10);
  camx=P.x-W/2;camy=P.y-H/2;
  if(P.hp>0){
    let vx=(keys.KeyD?1:0)-(keys.KeyA?1:0),vy=(keys.KeyS?1:0)-(keys.KeyW?1:0);
    const l=Math.hypot(vx,vy)||1;move(P,vx/l*220,vy/l*220,dt);
    P.a=Math.atan2(mouse.y+camy-P.y,mouse.x+camx-P.x);
    if(mouse.d&&P.cd<=0){shoot(P,P.a,14);P.cd=.25}
    if(pend){build(P)}
  }
  pend=false;
  for(const a of A){a.cd-=dt;if(a!==P)ai(a,dt)}
  for(const b of B){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    for(const w of Wl)if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){w.hp-=b.d;b.l=0;break}
    if(b.l>0)for(const a of A)if(a!==b.o&&Math.hypot(a.x-b.x,a.y-b.y)<17){a.hp-=b.d;b.l=0;break}
  }
  B=B.filter(b=>b.l>0);Wl=Wl.filter(w=>w.hp>0);
  const dmg=3+t/30;
  for(const a of A){
    if(Math.hypot(a.x-cx,a.y-cy)>R)a.hp-=dmg*dt;
    for(let i=pk.length-1;i>=0;i--){
      const p=pk[i];
      if(Math.hypot(a.x-p.x,a.y-p.y)<26){
        if(p.k==='w'){a.wood=Math.min(200,a.wood+10);pk.splice(i,1)}
        else if(a.hp<100){a.hp=Math.min(100,a.hp+25);pk.splice(i,1)}
      }
    }
  }
  A=A.filter(a=>a.hp>0||a===P);
  const alive=A.filter(a=>a.hp>0).length;
  $('al').textContent='Живих: '+alive;$('hp').style.width=Math.max(0,P.hp)+'%';
  $('wd').textContent='Дерево: '+Math.floor(P.wood);
  $('st').textContent=Math.hypot(P.x-cx,P.y-cy)>R?'Ви у шторму! Біжіть до зони':'';
  if(P.hp<=0)end(false);else if(alive===1)end(true);
}
function end(win){
  run=false;$('tt').textContent=win?'Перемога!':'Вас вибили';
  $('tx').textContent=win?'Ви залишилися останнім на острові.':'Ви протрималися '+Math.floor(t)+' с. Спробуйте ще раз.';
  $('go').textContent='Грати знову';$('ov').style.display='grid';
}
function draw(){
  X.fillStyle='#3b6e47';X.fillRect(0,0,W,H);
  X.save();X.translate(-camx,-camy);
  X.strokeStyle='rgba(255,255,255,.07)';X.lineWidth=1;X.beginPath();
  for(let i=0;i<=M;i+=100){X.moveTo(i,0);X.lineTo(i,M);X.moveTo(0,i);X.lineTo(M,i)}X.stroke();
  X.strokeStyle='#fff';X.lineWidth=4;X.strokeRect(0,0,M,M);
  for(const p of pk){
    if(p.k==='w'){X.fillStyle='#9a6b3a';X.fillRect(p.x-11,p.y-11,22,22);X.strokeStyle='#5c3b18';X.lineWidth=2;X.strokeRect(p.x-11,p.y-11,22,22)}
    else{X.fillStyle='#4be37a';X.fillRect(p.x-4,p.y-12,8,24);X.fillRect(p.x-12,p.y-4,24,8)}
  }
  for(const w of Wl){X.fillStyle='rgba(176,124,66,'+(.4+w.hp/250)+')';X.fillRect(w.x,w.y,w.w,w.h);X.strokeStyle='#5c3b18';X.lineWidth=2;X.strokeRect(w.x,w.y,w.w,w.h)}
  for(const a of A){
    if(a.hp<=0)continue;
    X.save();X.translate(a.x,a.y);X.rotate(a.a);
    X.fillStyle='#222';X.fillRect(8,-3,18,6);
    X.fillStyle=a===P?'#39a0ee':'#e8475f';X.beginPath();X.arc(0,0,14,0,7);X.fill();
    X.strokeStyle='#111';X.lineWidth=2;X.stroke();X.restore();
    if(a!==P){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(a.x-16,a.y-26,32,4);X.fillStyle='#4be37a';X.fillRect(a.x-16,a.y-26,32*a.hp/100,4)}
  }
  X.fillStyle='#ffe66b';for(const b of B){X.beginPath();X.arc(b.x,b.y,3,0,7);X.fill()}
  X.fillStyle='rgba(30,90,45,.88)';for(const r of trees){X.beginPath();X.arc(r.x,r.y,r.r,0,7);X.fill()}
  X.fillStyle='rgba(120,40,200,.4)';X.beginPath();X.rect(-2000,-2000,M+4000,M+4000);X.arc(cx,cy,R,0,7,true);X.fill('evenodd');
  X.strokeStyle='#c89bff';X.lineWidth=4;X.beginPath();X.arc(cx,cy,R,0,7);X.stroke();
  X.restore();
  const s=120/M,mx=W-134,my=H-134-0;
  X.fillStyle='rgba(0,0,0,.5)';X.fillRect(mx,my,120,120);
  X.strokeStyle='#c89bff';X.lineWidth=2;X.beginPath();X.arc(mx+cx*s,my+cy*s,R*s,0,7);X.stroke();
  for(const a of A){if(a.hp<=0)continue;X.fillStyle=a===P?'#39a0ee':'#e8475f';X.fillRect(mx+a.x*s-2,my+a.y*s-2,4,4)}
}
function loop(n){
  if(!run){draw();return}
  const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop);
}
</script>
</body>
</html>
